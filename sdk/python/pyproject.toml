[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-browser"
version = "0.69.1"
description = "Playwright drop-in for the CodeBrowser anti-fingerprint Chromium build. launch() returns a standard Playwright Browser backed by the verified CodeBrowser binary, which is auto-downloaded and SHA-256 checked."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
keywords = [
    "code-browser",
    "playwright",
    "chromium",
    "anti-detect",
    "anti-fingerprint",
    "fingerprint",
    "farbling",
    "automation",
    "stealth",
    "ungoogled",
]
dependencies = [
    "playwright>=1.40",
    "maxminddb>=2.2",
]

[project.scripts]
code-browser = "code_browser._commands:_console_main"
code-browser-agent = "code_browser.cli:main"
code-browser-serve = "code_browser._serve:_cli_main"

[project.optional-dependencies]
test = ["pytest>=7.3", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/jyycool/code-browser"
Repository = "https://github.com/jyycool/code-browser"
Issues = "https://github.com/jyycool/code-browser/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep tmp_path directories only for tests that failed (for debugging): by default pytest keeps the
# last three runs in full, browser profiles and fake binaries included.
tmp_path_retention_policy = "failed"

[tool.hatch.build.targets.wheel]
packages = ["code_browser"]

[tool.hatch.build.targets.sdist]
include = ["code_browser", "README.md", "LICENSE"]
