<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>code-browser</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="window">
  <header class="titlebar">
    <div class="titlebar-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="app-name" data-bind="appName">code-browser</span>
    </div>
    <div class="titlebar-controls">
      <button type="button" class="wc" id="wc-min" aria-label="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><line x1="1" y1="6" x2="11" y2="6"/></svg>
      </button>
      <button type="button" class="wc" id="wc-max" aria-label="最大化">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9"/></svg>
      </button>
      <button type="button" class="wc wc-close" id="wc-close" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><line x1="1.5" y1="1.5" x2="10.5" y2="10.5"/><line x1="10.5" y1="1.5" x2="1.5" y2="10.5"/></svg>
      </button>
    </div>
  </header>

  <!-- ① 首页 -->
  <main class="view view-home" id="view-home">
    <div class="home-center">
      <div class="logo" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>
      </div>
      <div class="home-text">
        <h1 data-bind="appName">code-browser</h1>
        <p data-bind="tagline"></p>
      </div>
      <button type="button" class="btn-start" id="btn-start">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"/></svg>
        开始
      </button>
      <div class="home-status">
        <div class="status-item"><span class="dot" id="kernel-dot"></span><span id="kernel-text">正在检查内核…</span></div>
        <span class="sep" aria-hidden="true">|</span>
        <div class="status-item"><span>身份：<span data-bind="identity"></span></span></div>
        <span class="sep" aria-hidden="true">|</span>
        <div class="status-item"><span>代理：<span data-bind="proxy"></span></span></div>
      </div>
      <ul class="warnings" id="warnings" hidden></ul>
    </div>
    <footer class="home-footer"><span><span data-bind="version"></span> · 设置已锁定，仅可通过配置文件修改</span></footer>
  </main>

  <!-- ② 启动中 / 启动失败 -->
  <main class="view view-center" id="view-loading" hidden>
    <section class="card" aria-live="polite">
      <div class="card-head">
        <div class="spinner-wrap" id="loading-spinner"><svg class="spinner" width="56" height="56" viewBox="0 0 56 56" fill="none" role="img" aria-label="正在加载">
          <circle cx="28" cy="28" r="24" stroke="#E5E7EB" stroke-width="5"/>
          <path d="M28 4 A24 24 0 0 1 52 28" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
        </svg></div>
        <div class="error-icon" id="loading-error-icon" hidden aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="7" x2="12" y2="13"/><circle cx="12" cy="16.5" r="0.6" fill="#B91C1C"/></svg>
        </div>
        <h1 id="loading-title">正在准备浏览器…</h1>
        <p class="error-text" id="loading-error" hidden></p>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="card-foot" id="loading-actions">
        <button type="button" class="btn-link" id="btn-cancel">取消</button>
      </div>
      <div class="card-foot card-foot-end" id="failed-actions" hidden>
        <button type="button" class="btn-secondary" id="btn-failed-home">返回首页</button>
        <button type="button" class="btn-primary" id="btn-retry">重试</button>
      </div>
    </section>
  </main>

  <!-- ③ 浏览器（嵌入） -->
  <main class="view view-browser" id="view-browser" hidden>
    <nav class="navbar" id="navbar" aria-label="浏览器导航">
      <button type="button" class="nav-btn" data-nav="back" aria-label="后退">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button type="button" class="nav-btn" data-nav="forward" aria-label="前进">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button type="button" class="nav-btn" data-nav="reload" aria-label="刷新">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><polyline points="20 4 20 11 13 11"/></svg>
      </button>
      <button type="button" class="nav-btn" data-nav="home" aria-label="回到起始页">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      </button>
      <div class="page-title" id="page-title"></div>
      <div class="notice-inline" id="notice-inline" role="status" hidden></div>
      <div class="egress" id="egress"><span class="dot dot-ok"></span><span id="egress-text">—</span></div>
      <button type="button" class="btn-stop" id="btn-stop">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        停止
      </button>
    </nav>
    <div class="notice-strip" id="notice-strip" role="status" hidden></div>
    <div class="browser-host" id="browser-host">
      <p class="host-hint">浏览器窗口显示在这里</p>
    </div>
  </main>

  <!-- ④ 浏览器意外退出 -->
  <main class="view view-center" id="view-crash" hidden>
    <section class="card card-center">
      <div class="warn-icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="0.6" fill="#B45309"/></svg>
      </div>
      <h1>浏览器已意外退出</h1>
      <p class="muted">登录状态和 Cookie 已保存在本地，<br>重新开始后会恢复为同一个身份。</p>
      <div class="row-buttons">
        <button type="button" class="btn-primary" id="btn-restart">重新开始</button>
        <button type="button" class="btn-secondary" id="btn-crash-home">返回首页</button>
      </div>
    </section>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
